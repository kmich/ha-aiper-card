<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e9eef3"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#039be5"/>
      <stop offset="1" stop-color="#43a047"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#1b2733" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- watermark gauge bleeding off the right edge -->
  <g transform="translate(1030 320)" fill="none" stroke-linecap="round">
    <circle r="300" stroke="#039be5" stroke-opacity="0.08" stroke-width="46"/>
    <path d="M -212 -212 A 300 300 0 0 1 212 -212" stroke="#039be5" stroke-opacity="0.16" stroke-width="46"/>
  </g>

  <!-- ================= left: text ================= -->
  <g transform="translate(96 0)">
    <text x="4" y="196" fill="#5b6b7a" font-size="24" font-weight="600" letter-spacing="4">HOME ASSISTANT · HACS DASHBOARD</text>

    <text x="0" y="300" fill="#1b2733" font-size="104" font-weight="700" letter-spacing="-2">Aiper Card</text>

    <text x="4" y="358" fill="#4a5661" font-size="30" font-weight="400">Lovelace cards for Aiper pool cleaners</text>
    <text x="4" y="400" fill="#4a5661" font-size="30" font-weight="400">&amp; HydroComm water-quality monitors</text>

    <!-- feature chips -->
    <g transform="translate(4 452)" font-size="20" font-weight="600" fill="#33475b">
      <g>
        <rect width="196" height="46" rx="23" fill="#ffffff" stroke="#d3dde5"/>
        <text x="98" y="30" text-anchor="middle">Status &amp; battery</text>
      </g>
      <g transform="translate(210 0)">
        <rect width="228" height="46" rx="23" fill="#ffffff" stroke="#d3dde5"/>
        <text x="114" y="30" text-anchor="middle">Mode &amp; clean-path</text>
      </g>
      <g transform="translate(452 0)">
        <rect width="212" height="46" rx="23" fill="#ffffff" stroke="#d3dde5"/>
        <text x="106" y="30" text-anchor="middle">Water chemistry</text>
      </g>
    </g>
  </g>

  <!-- ================= right: mini card mock ================= -->
  <g transform="translate(812 128)" filter="url(#card)">
    <rect width="372" height="384" rx="24" fill="#ffffff"/>

    <!-- status row -->
    <g transform="translate(32 40)">
      <circle cx="26" cy="26" r="26" fill="#e3f4fc"/>
      <g transform="translate(5 5) scale(1.75)" fill="#039be5">
        <path d="M12,2C14.65,2 17.19,3.06 19.07,4.93L17.65,6.35C16.15,4.85 14.12,4 12,4C9.88,4 7.84,4.84 6.35,6.35L4.93,4.93C6.81,3.06 9.35,2 12,2M3.66,6.5L5.11,7.94C4.39,9.17 4,10.57 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12C20,10.57 19.61,9.17 18.88,7.94L20.34,6.5C21.42,8.12 22,10.04 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12C2,10.04 2.58,8.12 3.66,6.5M12,6A6,6 0 0,1 18,12C18,13.59 17.37,15.12 16.24,16.24L14.83,14.83C14.08,15.58 13.06,16 12,16C10.94,16 9.92,15.58 9.17,14.83L7.76,16.24C6.63,15.12 6,13.59 6,12A6,6 0 0,1 12,6M12,8A1,1 0 0,0 11,9A1,1 0 0,0 12,10A1,1 0 0,0 13,9A1,1 0 0,0 12,8Z"/>
      </g>
      <text x="70" y="34" fill="#1b2733" font-size="26" font-weight="600">Cleaning</text>
      <text x="300" y="34" fill="#7a8794" font-size="22" font-weight="600" text-anchor="end">63%</text>
    </g>

    <!-- chips -->
    <g transform="translate(32 116)" font-size="18" font-weight="600">
      <g><rect width="92" height="40" rx="20" fill="#e3f4fc" stroke="#039be5" stroke-opacity="0.5"/><text x="46" y="26" text-anchor="middle" fill="#1b2733">Smart</text></g>
      <g transform="translate(104 0)"><rect width="86" height="40" rx="20" fill="#ffffff" stroke="#d3dde5"/><text x="43" y="26" text-anchor="middle" fill="#33475b">Floor</text></g>
      <g transform="translate(200 0)"><rect width="80" height="40" rx="20" fill="#ffffff" stroke="#d3dde5"/><text x="40" y="26" text-anchor="middle" fill="#33475b">Wall</text></g>
    </g>

    <!-- divider -->
    <line x1="32" y1="188" x2="340" y2="188" stroke="#eef2f6" stroke-width="2"/>

    <!-- gauges -->
    <g transform="translate(0 214)" fill="none" stroke-linecap="round">
      <g transform="translate(64 0)">
        <circle cx="46" cy="52" r="34" stroke="#eef2f6" stroke-width="9"/>
        <circle cx="46" cy="52" r="34" stroke="url(#ring)" stroke-width="9" stroke-dasharray="214" stroke-dashoffset="42" transform="rotate(-90 46 52)"/>
        <text x="46" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#1b2733" stroke="none">86</text>
        <text x="46" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#7a8794" stroke="none">SCORE</text>
      </g>
      <g transform="translate(196 8)">
        <path d="M0 60 A44 44 0 0 1 88 60" stroke="#eef2f6" stroke-width="9"/>
        <path d="M0 60 A44 44 0 0 1 74 26" stroke="#43a047" stroke-width="9"/>
        <text x="44" y="56" text-anchor="middle" font-size="24" font-weight="700" fill="#1b2733" stroke="none">7.4</text>
        <text x="44" y="92" text-anchor="middle" font-size="16" font-weight="600" fill="#7a8794" stroke="none">pH</text>
      </g>
    </g>
  </g>
</svg>
